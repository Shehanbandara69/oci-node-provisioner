name: Continuous OCI E2 Micro Provisioner

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

concurrency:
  group: oci-e2-micro-provisioner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  attempt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install OCI SDK requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Try to provision E2.1.Micro
        env:
          PYTHONUNBUFFERED: "1"
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_KEY_FILE: ${{ secrets.OCI_KEY_FILE }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANT_OCID: ${{ secrets.OCI_TENANT_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_PUBLIC_SSH_KEY: ${{ secrets.OCI_PUBLIC_SSH_KEY }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_INSTANCE_NAME: "Ubuntu-E2-Micro-2"
          OCI_BOOT_VOLUME_GB: "50"
          MAX_E2_MICROS: "2"
          MAX_RUNTIME_MINUTES: "320"
          MIN_SLEEP_SECONDS: "60"
          MAX_SLEEP_SECONDS: "120"
        run: python provision_e2_micro.py
